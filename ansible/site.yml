# Site.yml is the entrypoint you run to configure everthing.

- name: Prepare Raspberry Pi for k0s
  hosts: pi
  become: true # run as root
  roles:
    - role: common
      tags: common
    - role: network
      tags: network
    - role: k0s
      tags: k0s
    - role: kubectl
      tags: kubectl
    - role: tailscale
      tags: tailscale
