# Exit node + subnet router on the host. Running it in a pod put it behind
# kube-router's MASQUERADE --random-fully (hard NAT), which forced remote
# clients onto DERP relays.
- name: Add Tailscale apt signing key
  get_url:
    url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"

- name: Add Tailscale apt repository
  copy:
    dest: /etc/apt/sources.list.d/tailscale.list
    owner: root
    group: root
    mode: "0644"
    content: |
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu {{ ansible_distribution_release }} main
  register: tailscale_repo

- name: Install Tailscale
  apt:
    name: tailscale
    state: present
    update_cache: "{{ tailscale_repo.changed }}"
  retries: 10
  delay: 15
  register: tailscale_install
  until: tailscale_install is succeeded or ansible_check_mode
  # In --check the repo above isn't really added, so the package can't resolve
  ignore_errors: "{{ ansible_check_mode }}"

- name: Enable IP forwarding for exit node and subnet routes
  sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_file: /etc/sysctl.d/99-tailscale.conf
    state: present
    reload: true
  loop:
    - net.ipv4.ip_forward
    - net.ipv6.conf.all.forwarding

# kube-router writes its rules with iptables-nft; keep tailscaled on the same
# backend so the two don't end up split across iptables and native nftables.
- name: Pin tailscaled firewall mode to iptables
  lineinfile:
    path: /etc/default/tailscaled
    regexp: '^TS_DEBUG_FIREWALL_MODE='
    line: 'TS_DEBUG_FIREWALL_MODE=iptables'
  notify: restart tailscaled

- name: Enable tailscaled
  systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Apply tailscaled config changes before login
  meta: flush_handlers

- name: Check Tailscale login state
  command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false

- name: Join the tailnet
  command: >-
    tailscale up
    --auth-key={{ vault_tailscale_authkey }}
    --hostname={{ tailscale_hostname }}
    --advertise-exit-node
    --advertise-routes={{ tailscale_advertise_routes | join(',') }}
    --accept-dns=false
  when:
    - vault_tailscale_authkey is defined
    - (tailscale_status.stdout | default('{}') | from_json).BackendState | default('') != 'Running'
  no_log: true

- name: Interactive login needed
  debug:
    msg: >-
      No vault_tailscale_authkey set; run `sudo tailscale up --hostname={{ tailscale_hostname }}
      --advertise-exit-node --advertise-routes={{ tailscale_advertise_routes | join(',') }}
      --accept-dns=false` on the Pi and open the printed URL.
  when:
    - vault_tailscale_authkey is not defined
    - (tailscale_status.stdout | default('{}') | from_json).BackendState | default('') != 'Running'

# accept-dns=false keeps the host's resolv.conf (and so CoreDNS upstreams)
# untouched; accept-routes stays at its Linux default (off).
- name: Apply Tailscale settings
  command: >-
    tailscale set
    --hostname={{ tailscale_hostname }}
    --advertise-exit-node
    --advertise-routes={{ tailscale_advertise_routes | join(',') }}
    --accept-dns=false
  changed_when: false
  when: (tailscale_status.stdout | default('{}') | from_json).BackendState | default('') == 'Running'
