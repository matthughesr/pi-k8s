- name: Setup netplan file for ethernet and wifi
  copy:
    dest: /etc/netplan/00-installer-config.yaml
    owner: root
    group: root
    mode: '0644'
    content: |
      network:
        version: 2
        ethernets:
          eth0:
            dhcp4: yes
            dhcp4-overrides:
              route-metric: 100
        wifis:
          wlan0:
            dhcp4: no
            addresses:
              - "{{ ansible_wlan0.ipv4.address }}/{{ ansible_wlan0.ipv4.prefix }}"
            routes:
              - to: default
                via: "{{ ansible_default_ipv4.gateway }}"
                metric: 200
            nameservers:
              addresses:
                - "{{ ansible_default_ipv4.gateway }}"
            access-points:
              "{{ vault_host_name }}":
                password: "{{ vault_wifi_password }}"
  when: vault_host_name != ""
  notify: apply netplan