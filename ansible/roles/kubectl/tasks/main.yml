- name: Check if kubectl is installed
  stat:
    path: /snap/bin/kubectl
  register: kubectl_bin

- name: Install kubectl
  shell: snap install kubectl --classic
  when: not kubectl_bin.stat.exists

- name: Create .kube directory
  file:
    path: /home/{{ pi_username }}/.kube
    state: directory
    mode: "0755"

- name: Write kubeconfig
  shell: k0s kubeconfig admin > /home/{{ pi_username }}/.kube/config
  args:
    creates: /home/{{ pi_username }}/.kube/config  # only runs if file doesn't exist

- name: Set kubeconfig permissions
  file:
    path: /home/{{ pi_username }}/.kube/config
    mode: "0600"